<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Sayfa Bulunamadı (404) – Batuhan Ateş</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0f;
        color: #f3f4f6;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        padding: 24px;
      }
      .wrap { text-align: center; max-width: 480px; }
      .code {
        font-size: 96px;
        font-weight: 800;
        margin: 0 0 8px;
        background: linear-gradient(90deg, #6366f1, #8b5cf6, #ec4899);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 { font-size: 24px; margin: 0 0 12px; }
      p { color: #9ca3af; margin: 0 0 28px; line-height: 1.6; }
      a {
        display: inline-block;
        padding: 12px 28px;
        border-radius: 12px;
        background: linear-gradient(90deg, #6366f1, #8b5cf6);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      a:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="code">404</p>
      <h1>Aradığınız sayfa bulunamadı.</h1>
      <p>Bağlantı taşınmış veya hiç var olmamış olabilir. Ana sayfadan devam edebilirsiniz.</p>
      <a href="/">Ana Sayfaya Dön</a>
    </div>
  </body>
</html>
