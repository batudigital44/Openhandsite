[build]
  command = "npm run build"
  publish = "dist"

# Not: Bilinen tüm route'lar dist içinde statik HTML olarak mevcut. Eşleşmeyen
# URL'ler için Netlify, publish kökündeki 404.html dosyasını otomatik olarak 404
# durumuyla sunar. Catch-all bir redirect kuralı eklenmiyor; çünkü bu kural
# Netlify Forms POST isteklerini de yakalayıp 404 döndürüyor.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
